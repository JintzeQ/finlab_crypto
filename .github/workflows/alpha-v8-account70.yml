name: alpha-v8-account70
on:
  push:
    branches: [chatgpt-alpha-v8-account70-20260816]
    paths:
      - 'alpha_research_v8_account70.py'
      - '.github/workflows/alpha-v8-account70.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python alpha_research_v8_account70.py
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-v8-account70-output
          path: alpha_v8_account70_output/summary.json
