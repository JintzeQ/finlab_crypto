name: alpha-v2-research
on:
  push:
    branches: [chatgpt-alpha-research-20260816]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet numpy pandas
      - name: Run alpha research
        run: python alpha_research_v2.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v2-output
          path: alpha_v2_output
