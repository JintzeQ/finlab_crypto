name: alpha-v10-diversifier
on:
  push:
    branches: [chatgpt-alpha-v10-diversifier-20260816]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python alpha_v10_diversifier.py
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-v10-output
          path: alpha_v10_output/
