name: alpha-v17-pulse
on:
  workflow_dispatch:
  push:
    paths:
      - 'alpha_v17_pulse_governor.py'
      - '.github/workflows/alpha-v17-pulse.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python alpha_v17_pulse_governor.py
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-v17-output
          path: alpha_v17_output/
